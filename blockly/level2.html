<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Blockly Coding Adventure - Grade 2 & 3</title>

    <script src="https://unpkg.com/blockly/blockly.min.js"></script>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef7ff;
        text-align: center;
      }

      h1 {
        color: #1565c0;
        margin-bottom: 5px;
      }

      #levelTitle {
        color: #333;
      }

      #game {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 25px;
        flex-wrap: wrap;
        padding: 10px;
      }

      #blocklyDiv {
        width: 550px;
        height: 520px;
        background: white;
        border: 3px solid #2196f3;
        border-radius: 15px;
      }

      #rightSide {
        min-width: 350px;
      }

      #board {
        display: grid;
        gap: 4px;
        justify-content: center;
        margin: 15px auto;
      }

      .cell {
        width: 60px;
        height: 60px;

        background: white;
        border: 2px solid #90caf9;
        border-radius: 8px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 30px;
      }

      .obstacle {
        background: #78909c;
      }

      .coin {
        background: #fff8e1;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        margin: 5px;

        font-size: 18px;
        cursor: pointer;
        color: white;
      }

      #runButton {
        background: #43a047;
      }

      #resetButton {
        background: #757575;
      }

      #nextButton {
        background: #1976d2;
      }

      #message {
        min-height: 45px;
        font-size: 21px;
        font-weight: bold;
        margin: 10px;
      }

      #steps {
        font-size: 18px;
        color: #555;
      }

      #score {
        font-size: 20px;
        font-weight: bold;
        color: #f57c00;
      }

      #levelInfo {
        font-size: 16px;
        color: #555;
      }
    </style>
  </head>

  <body>
    <h1>🤖 Blockly Coding Adventure</h1>

    <h2 id="levelTitle">Level 1</h2>

    <p id="instructions"></p>

    <div id="levelInfo"></div>

    <div id="game">
      <!-- BLOCKLY -->

      <div id="blocklyDiv"></div>

      <!-- GAME BOARD -->

      <div id="rightSide">
        <h2>🗺️ Robot World</h2>

        <div id="score">⭐ Score: 0</div>

        <div id="board"></div>

        <button id="runButton" onclick="runCode()">▶️ Run</button>

        <button id="resetButton" onclick="resetGame()">🔄 Reset</button>

        <button id="nextButton" onclick="nextLevel()" style="display: none">
          ➡️ Next Level
        </button>

        <div id="steps"></div>

        <div id="message"></div>
      </div>
    </div>

    <!-- =====================================================
     TOOLBOX
====================================================== -->

    <xml id="toolbox" style="display: none">
      <category name="🚶 Movement" colour="120">
        <block type="move_right"></block>
        <block type="move_left"></block>
        <block type="move_down"></block>
        <block type="move_up"></block>
      </category>

      <category name="🔁 Loops" colour="290">
        <block type="controls_repeat_ext">
          <value name="TIMES">
            <shadow type="math_number">
              <field name="NUM">4</field>
            </shadow>
          </value>
        </block>
      </category>

      <category name="🎯 Logic" colour="210">
        <block type="controls_if"></block>
      </category>

      <category name="🔢 Math" colour="230">
        <block type="math_number"></block>
      </category>
    </xml>

    <script>
      // ======================================================
      // LEVELS
      // ======================================================

      const levels = [
        /* LEVEL 1 */

        {
          rows: 2,
          cols: 4,
          start: 0,
          goal: 7,
          obstacles: [2],
          coins: [],
          instructions: "Level 1: Reach the star. Avoid the 🧱!",
        },

        /* LEVEL 2 */

        {
          rows: 3,
          cols: 4,
          start: 0,
          goal: 11,
          obstacles: [1, 5, 6],
          coins: [4],
          instructions: "Level 2: Find a safe path to ⭐.",
        },

        /* LEVEL 3 */

        {
          rows: 4,
          cols: 5,
          start: 0,
          goal: 19,
          obstacles: [1, 6, 11, 13, 14],
          coins: [5, 10],
          instructions: "Level 3: Go around the obstacles!",
        },

        /* LEVEL 4 */

        {
          rows: 4,
          cols: 5,
          start: 0,
          goal: 19,
          obstacles: [1, 6, 11],
          coins: [2, 7, 12],
          instructions: "Level 4: Use a longer path.",
        },

        /* LEVEL 5 */

        {
          rows: 5,
          cols: 5,
          start: 0,
          goal: 24,
          obstacles: [1, 2, 6, 8, 11, 12, 16, 18],
          coins: [5, 10, 15],
          instructions: "Level 5: Watch carefully for 🧱!",
        },

        /* LEVEL 6 */

        {
          rows: 5,
          cols: 6,
          start: 0,
          goal: 29,
          obstacles: [1, 2, 3, 7, 9, 10, 13, 15, 16, 19, 21, 22, 25],
          coins: [6, 12, 18, 24],
          instructions: "Level 6: Find the hidden route!",
        },

        /* LEVEL 7 */

        {
          rows: 5,
          cols: 6,
          start: 0,
          goal: 29,
          obstacles: [2, 3, 8, 9, 10, 14, 15, 20, 21],
          coins: [1, 7, 13, 19, 25],
          instructions: "Level 7: Try using a 🔁 Repeat block!",
        },

        /* LEVEL 8 */

        {
          rows: 6,
          cols: 6,
          start: 0,
          goal: 35,
          obstacles: [1, 2, 7, 8, 13, 14, 15, 20, 21, 22, 27, 28, 33],
          coins: [6, 12, 18, 24, 30],
          instructions: "Level 8: Use loops to make your code shorter!",
        },

        /* LEVEL 9 */

        {
          rows: 6,
          cols: 7,
          start: 0,
          goal: 41,
          obstacles: [1, 2, 3, 9, 10, 11, 17, 18, 24, 25, 26, 32, 33, 38],
          coins: [7, 14, 21, 28, 35],
          instructions: "Level 9: Can you solve it with fewer blocks?",
        },

        /* LEVEL 10 */

        {
          rows: 6,
          cols: 7,
          start: 0,
          goal: 41,
          obstacles: [1, 2, 8, 9, 10, 16, 17, 23, 24, 25, 30, 31, 37],
          coins: [7, 14, 21, 28, 35],
          instructions: "Level 10: Plan before you run your code!",
        },

        /* LEVEL 11 */

        {
          rows: 7,
          cols: 7,
          start: 0,
          goal: 48,
          obstacles: [
            1, 2, 3, 8, 9, 10, 11, 17, 18, 24, 25, 26, 31, 32, 38, 39, 46,
          ],
          coins: [7, 14, 21, 28, 35, 42],
          instructions: "Level 11: A big maze! Think carefully.",
        },

        /* LEVEL 12 */

        {
          rows: 7,
          cols: 8,
          start: 0,
          goal: 55,
          obstacles: [
            1, 2, 9, 10, 11, 17, 18, 19, 26, 27, 28, 34, 35, 36, 42, 43, 44, 50,
            51, 
          ],
          coins: [8, 16, 24, 32, 40, 48],
          instructions: "🏆 Final Challenge: Solve the maze!",
        },
      ];

      let currentLevel = 0;

      let robotPosition = 0;

      let score = 0;

      let isRunning = false;

      // ======================================================
      // CUSTOM BLOCKS
      // ======================================================

      Blockly.Blocks["move_right"] = {
        init: function () {
          this.appendDummyInput().appendField("➡️ Right");

          this.setPreviousStatement(true);
          this.setNextStatement(true);

          this.setColour(120);
        },
      };

      Blockly.Blocks["move_left"] = {
        init: function () {
          this.appendDummyInput().appendField("⬅️ Left");

          this.setPreviousStatement(true);
          this.setNextStatement(true);

          this.setColour(20);
        },
      };

      Blockly.Blocks["move_down"] = {
        init: function () {
          this.appendDummyInput().appendField("⬇️ Down");

          this.setPreviousStatement(true);
          this.setNextStatement(true);

          this.setColour(210);
        },
      };

      Blockly.Blocks["move_up"] = {
        init: function () {
          this.appendDummyInput().appendField("⬆️ Up");

          this.setPreviousStatement(true);
          this.setNextStatement(true);

          this.setColour(280);
        },
      };

      // ======================================================
      // GENERATOR
      // ======================================================

      javascript.javascriptGenerator.forBlock["move_right"] = function () {
        return "moveRight();\n";
      };

      javascript.javascriptGenerator.forBlock["move_left"] = function () {
        return "moveLeft();\n";
      };

      javascript.javascriptGenerator.forBlock["move_down"] = function () {
        return "moveDown();\n";
      };

      javascript.javascriptGenerator.forBlock["move_up"] = function () {
        return "moveUp();\n";
      };

      // ======================================================
      // WORKSPACE
      // ======================================================

      const workspace = Blockly.inject("blocklyDiv", {
        toolbox: document.getElementById("toolbox"),

        scrollbars: true,

        trashcan: true,
      });

      // ======================================================
      // CREATE BOARD
      // ======================================================

      function createBoard() {
        const level = levels[currentLevel];

        const board = document.getElementById("board");

        board.innerHTML = "";

        board.style.gridTemplateColumns = `repeat(${level.cols}, 60px)`;

        for (let i = 0; i < level.rows * level.cols; i++) {
          const cell = document.createElement("div");

          cell.className = "cell";

          cell.id = "cell-" + i;

          if (level.obstacles.includes(i)) {
            cell.classList.add("obstacle");

            cell.innerHTML = "🧱";
          }

          if (level.coins.includes(i)) {
            cell.classList.add("coin");

            cell.innerHTML = "🪙";
          }

          board.appendChild(cell);
        }

        drawRobot();
      }

      // ======================================================
      // DRAW ROBOT
      // ======================================================

      function drawRobot() {
        const level = levels[currentLevel];

        for (let i = 0; i < level.rows * level.cols; i++) {
          const cell = document.getElementById("cell-" + i);

          if (!cell) continue;

          if (level.obstacles.includes(i)) {
            cell.innerHTML = "🧱";
          } else if (level.coins.includes(i)) {
            cell.innerHTML = "🪙";
          } else {
            cell.innerHTML = "";
          }
        }

        const goal = document.getElementById("cell-" + level.goal);

        if (goal) {
          goal.innerHTML = "⭐";
        }

        const robot = document.getElementById("cell-" + robotPosition);

        if (robot) {
          if (robotPosition === level.goal) {
            robot.innerHTML = "🤖⭐";
          } else {
            robot.innerHTML = "🤖";
          }
        }
      }

      // ======================================================
      // CAN MOVE
      // ======================================================

      function canMove(position) {
        const level = levels[currentLevel];

        if (position < 0 || position >= level.rows * level.cols) {
          return false;
        }

        if (level.obstacles.includes(position)) {
          return false;
        }

        return true;
      }

      // ======================================================
      // MOVEMENT
      // ======================================================

      function moveRight() {
        const level = levels[currentLevel];

        const col = robotPosition % level.cols;

        if (col < level.cols - 1) {
          const newPosition = robotPosition + 1;

          if (canMove(newPosition)) {
            robotPosition = newPosition;

            collectCoin();
          } else {
            hitObstacle();
          }
        }

        drawRobot();
      }

      function moveLeft() {
        const level = levels[currentLevel];

        const col = robotPosition % level.cols;

        if (col > 0) {
          const newPosition = robotPosition - 1;

          if (canMove(newPosition)) {
            robotPosition = newPosition;

            collectCoin();
          } else {
            hitObstacle();
          }
        }

        drawRobot();
      }

      function moveDown() {
        const level = levels[currentLevel];

        const newPosition = robotPosition + level.cols;

        if (canMove(newPosition)) {
          robotPosition = newPosition;

          collectCoin();
        } else {
          hitObstacle();
        }

        drawRobot();
      }

      function moveUp() {
        const level = levels[currentLevel];

        const newPosition = robotPosition - level.cols;

        if (canMove(newPosition)) {
          robotPosition = newPosition;

          collectCoin();
        } else {
          hitObstacle();
        }

        drawRobot();
      }

      // ======================================================
      // COINS
      // ======================================================

      function collectCoin() {
        const level = levels[currentLevel];

        const index = level.coins.indexOf(robotPosition);

        if (index !== -1) {
          score += 10;

          level.coins.splice(index, 1);

          updateScore();
        }
      }

      // ======================================================
      // OBSTACLE
      // ======================================================

      function hitObstacle() {
        document.getElementById("message").innerHTML =
          "🧱 Oops! You hit an obstacle!";
      }

      // ======================================================
      // SCORE
      // ======================================================

      function updateScore() {
        document.getElementById("score").innerHTML = "⭐ Score: " + score;
      }

      // ======================================================
      // WAIT
      // ======================================================

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      // ======================================================
      // RUN
      // ======================================================

      async function runCode() {
        if (isRunning) return;

        isRunning = true;

        document.getElementById("message").innerHTML = "";

        document.getElementById("nextButton").style.display = "none";

        robotPosition = levels[currentLevel].start;

        drawRobot();

        const code = javascript.javascriptGenerator.workspaceToCode(workspace);

        const steps = code
          .split("\n")
          .map((x) => x.trim())
          .filter((x) => x.length > 0);

        let stepNumber = 0;

        for (const step of steps) {
          stepNumber++;

          document.getElementById("steps").innerHTML = "👣 Step " + stepNumber;

          if (step === "moveRight();") {
            moveRight();
          } else if (step === "moveLeft();") {
            moveLeft();
          } else if (step === "moveDown();") {
            moveDown();
          } else if (step === "moveUp();") {
            moveUp();
          }

          await wait(700);
        }

        checkLevel();

        isRunning = false;
      }

      // ======================================================
      // CHECK LEVEL
      // ======================================================

      function checkLevel() {
        const level = levels[currentLevel];

        if (robotPosition === level.goal) {
          score += 50;

          updateScore();

          document.getElementById("message").innerHTML =
            "🎉 Level Complete! +50 ⭐";

          document.getElementById("message").style.color = "#2e7d32";

          if (currentLevel < levels.length - 1) {
            document.getElementById("nextButton").style.display =
              "inline-block";
          } else {
            document.getElementById("message").innerHTML =
              "🏆 AMAZING! You completed all 12 levels!";
          }
        } else {
          document.getElementById("message").innerHTML =
            "🤔 Keep trying! Find a path to ⭐";

          document.getElementById("message").style.color = "#d32f2f";
        }
      }

      // ======================================================
      // RESET
      // ======================================================

      function resetGame() {
        isRunning = false;

        robotPosition = levels[currentLevel].start;

        document.getElementById("message").innerHTML = "";

        document.getElementById("steps").innerHTML = "";

        document.getElementById("nextButton").style.display = "none";

        workspace.clear();

        createBoard();
      }

      // ======================================================
      // NEXT LEVEL
      // ======================================================

      function nextLevel() {
        if (currentLevel >= levels.length - 1) {
          return;
        }

        currentLevel++;

        robotPosition = levels[currentLevel].start;

        workspace.clear();

        document.getElementById("levelTitle").innerHTML =
          "Level " + (currentLevel + 1);

        document.getElementById("instructions").innerHTML =
          levels[currentLevel].instructions;

        document.getElementById("levelInfo").innerHTML =
          "🧱 Obstacles: " + levels[currentLevel].obstacles.length;

        document.getElementById("message").innerHTML = "";

        document.getElementById("steps").innerHTML = "";

        document.getElementById("nextButton").style.display = "none";

        createBoard();
      }

      // ======================================================
      // START
      // ======================================================

      document.getElementById("instructions").innerHTML =
        levels[0].instructions;

      document.getElementById("levelInfo").innerHTML =
        "🧱 Obstacles: " + levels[0].obstacles.length;

      createBoard();

      updateScore();
    </script>
  </body>
</html>
